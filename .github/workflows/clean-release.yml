name: Clean Releases

on:
  schedule:
    - cron: '23 4 * * 0'   # weekly, Sunday 04:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting (scheduled runs always delete)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: clean-release
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          KEEP_LATEST=8
          CUTOFF_EPOCH=$(date -d '3 months ago' +%s)
          echo "Cutoff (3 months ago): $(date -d @"$CUTOFF_EPOCH" -u)"
          echo "Keeping latest: $KEEP_LATEST | dry_run=${DRY_RUN:-false}"

          mapfile -t rows < <(gh release list --limit 100 --json tagName,createdAt --jq '.[] | "\(.tagName)\t\(.createdAt)"')

          if [ "${#rows[@]}" -eq 0 ]; then
            echo "No releases found."
            exit 0
          fi

          for i in "${!rows[@]}"; do
            tag="${rows[$i]%%$'\t'*}"
            created="${rows[$i]##*$'\t'}"
            created_fixed="${created/%Z/+00:00}"
            ts=$(date -d "$created_fixed" +%s)

            if [ "$i" -lt "$KEEP_LATEST" ]; then
              echo "KEEP   (#$i, latest)        $tag"
              continue
            fi

            if [ "$ts" -lt "$CUTOFF_EPOCH" ]; then
              if [ "${DRY_RUN:-}" = "true" ]; then
                echo "WOULD DELETE (#$i, >3m)   $tag"
              else
                echo "DELETE (#$i, >3m)         $tag"
                gh release delete "$tag" --yes --cleanup-tag || echo "  ! failed to delete $tag"
              fi
            else
              echo "KEEP   (#$i, recent)        $tag"
            fi
          done

          echo "Done."
